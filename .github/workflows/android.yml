name: APK Android

# Deux usages :
#
#  · à la demande, un APK de debug en artefact — de quoi faire tester
#    l'application à quelqu'un sans attendre la validation du Play Store ;
#  · sur un tag `v*`, le même APK attaché à une GitHub Release, donc un lien
#    d'installation partageable immédiatement.
#
# Cet APK est signé avec la clé de debug d'Android : il s'installe, il tourne,
# mais il ne peut pas être publié sur le Play Store et ne se met pas à jour
# par-dessus une version signée avec la vraie clé. La production passe par
# `npm run android:release` en local, avec le keystore qui ne quitte jamais la
# machine — voir PUBLICATION.md.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Construire le web et synchroniser Capacitor
        run: npm run cap:sync

      - name: Construire l'APK de debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: scp-audio-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Seule action tierce de ce dépôt, et la seule à s'exécuter avec
      # `contents: write`. Épinglée par empreinte de commit et non par `@v2` : un
      # tag est mutable, et un mainteneur compromis qui le redéplace exécuterait
      # son code avec le droit d'écrire sur ce dépôt. C'est le scénario qui a
      # frappé `tj-actions/changed-files` en 2025. Le commentaire garde la version
      # lisible ; Dependabot met les deux à jour ensemble.
      - name: Attacher l'APK à la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          body: |
            APK de test signé avec la clé de debug d'Android.

            Pour l'installer, autorisez les sources inconnues sur le téléphone.
            La version du Play Store, elle, est signée avec la clé de
            publication : voir PUBLICATION.md.

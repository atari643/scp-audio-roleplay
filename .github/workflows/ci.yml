name: CI

# `tsc -b` en mode strict est le seul filet du projet : il n'y a ni tests, ni
# ESLint. Ce workflow est donc littéralement la totalité de la vérification
# automatique, d'où le fait qu'il tourne sur chaque poussée et chaque PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck et build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire
        run: npm run build

      - name: Publier le résultat du build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

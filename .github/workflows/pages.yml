name: Miroir GitHub Pages

# Publie une démonstration du site sur `https://atari643.github.io/scp-audio-roleplay/`.
#
# Deux variables font tout le travail :
#
#  · VITE_BASE — Pages sert le site sous un sous-chemin, pas à la racine du
#    domaine. Sans elle, le navigateur irait chercher les paquets à la racine et
#    n'afficherait qu'une page blanche.
#
#  · VITE_TTS_ENDPOINT — Pages ne sait pas exécuter de fonction, donc `/api/tts`
#    n'existe pas ici. Renseignez cette variable (Réglages → Secrets and
#    variables → Actions → Variables) avec l'URL de la fonction déployée sur
#    Vercel, par exemple `https://scp-audio-roleplay.vercel.app/api/tts`, et le
#    miroir garde les voix neurales dans Chrome et Firefox. Laissée vide, le
#    miroir reste utilisable mais retombe sur les voix du navigateur — sauf dans
#    Edge, qui joint le service de synthèse en direct.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; une poussée plus récente remplace la
# précédente sans l'interrompre en plein déploiement.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Construire pour le sous-chemin de Pages
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_TTS_ENDPOINT: ${{ vars.VITE_TTS_ENDPOINT }}
        run: npm run build

      - name: 404 identique à l'index (l'application est une SPA)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# Mises à jour de dépendances.
#
# Ce fichier existe surtout pour une raison : sans lui, Dependabot échouait en
# boucle sur l'avis `uuid` (GHSA, sévérité moyenne — contrôle de bornes manquant
# sur `v3/v5/v6` quand un `buf` est fourni). La chaîne est
# `@capacitor/cli` → `xcode` → `uuid@^7`, et le seul chemin de correction que npm
# trouve rétrograderait `@capacitor/cli` de 8.5.1 à 8.4.3. Le bot refuse, signale
# une erreur, et le dépôt public affiche un run rouge permanent pour un risque
# nul : `@capacitor/cli` est une dépendance de développement, elle ne part ni dans
# le paquet web, ni dans l'APK. L'ignorer est un choix, pas un oubli — à revoir
# quand `@capacitor/cli` embarquera un `xcode` à jour.

# Le premier essai a ouvert neuf demandes de tirage d'un coup. Le bruit se règle
# par **groupement**, pas par `ignore` :
#
#   une condition `ignore` s'applique AUSSI aux mises à jour de sécurité.
#
# Écarter toutes les majeures, comme je l'avais d'abord écrit, revenait donc à ne
# jamais être prévenu d'une faille dont le correctif n'existe que dans une version
# majeure — exactement l'inverse du but. Les majeures arrivent maintenant dans
# leur propre demande, séparée : on les voit venir, on les lit, et le journal des
# modifications décide. Deux demandes au lieu de neuf, sans angle mort.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 4
    groups:
      mineures:
        patterns: ['*']
        update-types: [minor, patch]
      majeures:
        patterns: ['*']
        update-types: [major]
    ignore:
      # Le SEUL `ignore` du fichier, et il est assumé : l'avis vise `uuid`, tiré
      # par `@capacitor/cli` → `xcode`. Dépendance de développement, absente du
      # paquet web comme de l'APK, et son unique chemin de correction
      # rétrograderait `@capacitor/cli`. À retirer dès que `xcode` embarquera un
      # `uuid` à jour — c'est une dette, pas une décision définitive.
      - dependency-name: uuid
        versions: ['<9']

  # Les actions des trois workflows (CI, miroir Pages, APK Android) : une action
  # épinglée qui vieillit finit par tourner sur un runner qui ne la supporte plus.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']

<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icones/icone-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c10" />
    <meta name="description" content="Lecteur Audio Roleplay Multi-voix de dossiers de la Fondation SCP en plusieurs langues" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>SCP Foundation - Archive Audio Roleplay</title>

    <!--
      Aperçu des liens partagés. Sans ces balises, l'adresse collée dans une
      conversation n'est qu'une URL nue : ni titre, ni image, ni description.
      L'image est l'icône 512, la seule du projet qui reste lisible en vignette.
      Elle est référencée en relatif pour valoir aussi bien sur le déploiement
      Vercel que sur le miroir Pages, servi sous un sous-chemin. Pas d'`og:url` :
      une URL en dur y désignerait toujours le même des deux hébergements.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SCP Audio Roleplay" />
    <meta property="og:title" content="SCP Audio Roleplay" />
    <meta
      property="og:description"
      content="Les dossiers de la Fondation SCP, lus à voix haute — avec une voix par personnage."
    />
    <meta property="og:image" content="./icones/icone-512.png" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SCP Audio Roleplay" />
    <meta
      name="twitter:description"
      content="Les dossiers de la Fondation SCP, lus à voix haute — avec une voix par personnage."
    />
    <meta name="twitter:image" content="./icones/icone-512.png" />

    <!-- Le manifeste existait mais n'était lié nulle part : sans cette ligne, aucun
         navigateur ne le lit et l'application n'est pas installable. -->
    <link rel="manifest" href="./manifest.json" />

    <!--
      Polices.

      Chargées sans bloquer le premier rendu : `media="print"` fait sortir la feuille du
      chemin critique, `onload` la réactive une fois arrivée. Le `display=swap` de l'URL
      garantit que le texte reste lisible en police système entre-temps — sur une
      connexion mobile, c'est la différence entre une page qui s'affiche et un écran vide.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
      media="print"
      onload="this.media='all'"
    >
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
    </noscript>
  </head>
  <body class="bg-fond text-texte font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

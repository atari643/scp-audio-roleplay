<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icones/icone-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c10" />
    <meta name="description" content="Lecteur Audio Roleplay Multi-voix de dossiers de la Fondation SCP en plusieurs langues" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>SCP Foundation - Archive Audio Roleplay</title>

    <!-- Le manifeste existait mais n'était lié nulle part : sans cette ligne, aucun
         navigateur ne le lit et l'application n'est pas installable. -->
    <link rel="manifest" href="./manifest.json" />

    <!--
      Polices.

      Chargées sans bloquer le premier rendu : `media="print"` fait sortir la feuille du
      chemin critique, `onload` la réactive une fois arrivée. Le `display=swap` de l'URL
      garantit que le texte reste lisible en police système entre-temps — sur une
      connexion mobile, c'est la différence entre une page qui s'affiche et un écran vide.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
      media="print"
      onload="this.media='all'"
    >
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
    </noscript>
  </head>
  <body class="bg-fond text-texte font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
